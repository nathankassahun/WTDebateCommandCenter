            try {
                const stored = localStorage.getItem(STORAGE_KEY);

                    TEAM_DATA.forEach(s => {
                        if (presentIds.includes(s.id)) {
                            s.present = true;
                        } else {
                            s.present = false;
                        }
                    });
                }
            } catch (e) {
                console.error("Failed to load attendance", e);
            }
        }

            try {
                const presentIds = TEAM_DATA.filter(s => s.present).map(s => s.id);

            } catch (e) {
                console.error("Failed to save attendance", e);
            }

                    <!-- Quick Categories -->
                    <div>
                         <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3 px-2">Team Breakdown</h3>
                         <div class="grid grid-cols-2 gap-2">
                            ${CATEGORIES.map(cat => {
                                const count = TEAM_DATA.filter(s => s.events.some(e => e.category === cat)).length;
                                const checkedIn = TEAM_DATA.filter(s => s.events.some(e => e.category === cat) && s.present).length;
                                if (count === 0) return '';
                                const isFull = count === checkedIn;
                                return `
                                    <div class="p-3 bg-white/5 border border-white/5 rounded-2xl flex justify-between items-center">
                                        <div class="flex flex-col">
                                            <span class="text-[10px] text-gray-400 font-bold uppercase truncate max-w-[100px]">${cat}</span>
                                            <span class="text-xs font-bold ${isFull ? 'text-green-400' : 'text-white'}">${checkedIn}/${count} <span class="text-[9px] font-normal text-gray-500">Here</span></span>
                                        </div>
                                        ${isFull ? '<i class="fa-solid fa-check-circle text-green-500 text-xs"></i>' : ''}
                                    </div>
                                `;
                            }).join('')}
                         </div>
                    </div>
                </div>
            `;
        }

        function renderAttendance(container) {
            const missing = TEAM_DATA.filter(s => !s.present);
            const present = TEAM_DATA.filter(s => s.present);

            container.innerHTML = `
                <div class="space-y-6 animate-slide-up pb-10">
                    <!-- Missing Section -->
                    <div>
                        <div class="flex items-center gap-2 mb-3 px-2">
                            <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                            <h3 class="text-sm font-bold text-white uppercase tracking-widest">Missing (${missing.length})</h3>
                        </div>
                        
                        ${missing.length === 0 ? 
                            `<div class="p-6 text-center text-gray-500 text-xs italic bg-white/5 rounded-3xl border border-white/5">All students accounted for!</div>` : 
                            `<div class="space-y-2">
                                ${missing.map(student => `
                                    <div class="ios-glass p-3 rounded-2xl flex items-center justify-between border-l-4 border-l-red-500 tap-scale">
                                        <div class="flex items-center gap-3" onclick="openModal(${student.id})">
                                            <div class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center text-xs font-bold text-white">
                                                ${getInitials(student.name)}
                                            </div>
                                            <div>
                                                <p class="font-bold text-white text-sm">${student.name}</p>
                                                <p class="text-[10px] text-gray-400">${student.phone || 'No Phone'}</p>
                                            </div>
                                        </div>
                                        <button onclick="toggleAttendance(${student.id})" class="w-10 h-10 rounded-full bg-white/10 hover:bg-green-500/20 text-gray-400 hover:text-green-400 flex items-center justify-center transition-colors">
                                            <i class="fa-solid fa-check"></i>
                                        </button>
                                    </div>
                                `).join('')}
                            </div>`
                        }
                    </div>

                    <!-- Present Section -->
                    <div class="opacity-80">
                         <div class="flex items-center gap-2 mb-3 px-2 mt-8">
                            <div class="w-2 h-2 rounded-full bg-green-500"></div>
                            <h3 class="text-sm font-bold text-white uppercase tracking-widest">Present (${present.length})</h3>
                        </div>
                        <div class="space-y-2">
                            ${present.map(student => `
                                <div class="bg-white/5 p-3 rounded-2xl flex items-center justify-between border border-white/5 opacity-60 hover:opacity-100 transition-opacity">
                                    <div class="flex items-center gap-3">
                                        <div class="w-8 h-8 rounded-full bg-green-900/50 flex items-center justify-center text-[10px] font-bold text-green-400 border border-green-500/30">
                                            ${getInitials(student.name)}
                                        </div>
                                        <p class="font-medium text-gray-300 text-sm strike-through">${student.name}</p>
                                    </div>
                                    <button onclick="toggleAttendance(${student.id})" class="text-xs text-gray-500 hover:text-red-400 px-3 py-2">
                                        Undo
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Reset Button -->
                    <div class="pt-8 pb-4 flex justify-center opacity-50 hover:opacity-100 transition-opacity">
                        <button onclick="resetAllAttendance()" class="flex items-center gap-2 text-xs font-bold text-red-400 uppercase tracking-widest px-4 py-2 rounded-lg hover:bg-red-500/10 transition-colors">
                            <i class="fa-solid fa-rotate-right"></i> Reset Roster
                        </button>
                    </div>
                </div>
            `;
        }

        function renderRoster(container) {
            const filtered = TEAM_DATA.filter(s => 
                s.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                s.events.some(e => e.code.toLowerCase().includes(searchQuery.toLowerCase())) ||
                s.events.some(e => e.category.toLowerCase().includes(searchQuery.toLowerCase()))
            );

            container.innerHTML = `
                <div class="space-y-4 animate-slide-up h-full flex flex-col">
                    <div class="sticky top-0 z-20 pb-2 bg-gradient-to-b from-black via-black/90 to-transparent pt-2 -mt-2">
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
                            <input 
                                type="text" 
                                placeholder="Find student, event..." 
                                value="${searchQuery}"
                                oninput="updateSearch(this.value)"
                                class="w-full bg-white/10 backdrop-blur-md border border-white/10 text-white pl-10 pr-4 py-3 rounded-2xl focus:outline-none focus:ring-2 focus:ring-sky-500/50 placeholder-gray-500 text-sm transition-all shadow-inner"
                            >
                        </div>
                    </div>

                    <div class="space-y-2 pb-20">
                        ${filtered.map(student => `
                            <div onclick="openModal(${student.id})" class="flex items-center justify-between p-3 bg-white/5 rounded-2xl tap-scale cursor-pointer border border-white/5 hover:border-sky-500/30 group transition-colors">
                                <div class="flex items-center gap-4">
                                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-gray-800 to-black flex items-center justify-center text-white text-sm font-bold shadow-lg border border-white/5 group-hover:border-sky-500/50 transition-colors">
                                        ${getInitials(student.name)}
                                    </div>
                                    <div>
                                        <p class="font-bold text-white text-sm">${student.name}</p>
                                        <div class="flex gap-1 mt-1">
                                            ${student.events.map(e => `<span class="px-1.5 py-0.5 bg-white/10 rounded text-[9px] text-gray-400 font-medium">${e.code}</span>`).join('')}
                                        </div>
                                    </div>
                                </div>
                                <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center">
                                    <i class="fa-solid fa-chevron-right text-gray-600 text-xs group-hover:text-white transition-colors"></i>
                                </div>
                            </div>
                        `).join('')}
                        ${filtered.length === 0 ? '<div class="text-center py-10 text-gray-500 text-sm">No matches found.</div>' : ''}
                    </div>
                </div>
            `;
        }

        // --- UTILS & LOGIC ---

        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
        }

        function updateSearch(val) {
            searchQuery = val;
            renderRoster(document.getElementById('app-container'));
        }

        function toggleAttendance(id) {
            const student = TEAM_DATA.find(s => s.id === id);
            if (student) {
                student.present = !student.present;
                saveAttendance(); // Save to localStorage
                
                // Re-render current view
                if (currentView === 'attendance') renderAttendance(document.getElementById('app-container'));
                if (currentView === 'dashboard') renderDashboard(document.getElementById('app-container'));
            }
        }

        function toggleAttendanceFromModal() {
            if (currentlyOpenStudentId === null) return;
            toggleAttendance(currentlyOpenStudentId);
            
            // Update Modal UI
            const student = TEAM_DATA.find(s => s.id === currentlyOpenStudentId);
            const btn = document.getElementById('modal-attendance-btn');
            const icon = document.getElementById('modal-attendance-icon');
            
            if (student.present) {
                btn.className = "w-14 h-14 rounded-full flex items-center justify-center transition-all duration-300 shadow-lg bg-green-500 text-white shadow-green-500/40";
                icon.className = "fa-solid fa-check text-xl";
            } else {
                btn.className = "w-14 h-14 rounded-full flex items-center justify-center transition-all duration-300 shadow-lg bg-white/10 text-gray-400 hover:bg-white/20";
                icon.className = "fa-solid fa-user-xmark text-xl";
            }
        }

        function openModal(id) {
            const student = TEAM_DATA.find(s => s.id === id);
            if (!student) return;
            currentlyOpenStudentId = id;

            // Info
            document.getElementById('modal-title').textContent = student.name;
            document.getElementById('modal-tags').innerHTML = student.events.map(ev => 
                `<span class="bg-sky-500/10 text-sky-300 border border-sky-500/20 px-2 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider">${ev.category} (${ev.code})</span>`
            ).join('');

            // Attendance Button State
            const btn = document.getElementById('modal-attendance-btn');
            const icon = document.getElementById('modal-attendance-icon');
            if (student.present) {
                btn.className = "w-14 h-14 rounded-full flex items-center justify-center transition-all duration-300 shadow-lg bg-green-500 text-white shadow-green-500/40";
                icon.className = "fa-solid fa-check text-xl";
            } else {
                btn.className = "w-14 h-14 rounded-full flex items-center justify-center transition-all duration-300 shadow-lg bg-white/10 text-gray-400 hover:bg-white/20";
                icon.className = "fa-solid fa-user-xmark text-xl";
            }

            // Student Contact
            document.getElementById('modal-phone').textContent = student.phone || "No Number";
            document.getElementById('modal-phone-link').href = student.phone ? `tel:${student.phone}` : '#';
            document.getElementById('modal-sms-link').href = student.phone ? `sms:${student.phone}` : '#';
            
            document.getElementById('modal-email').textContent = student.email || "No Email";
            document.getElementById('modal-email-link').href = student.email ? `mailto:${student.email}` : '#';

            // Parents
            const pContainer = document.getElementById('modal-parents');
            if (student.parents.length > 0) {
                pContainer.innerHTML = student.parents.map(p => `
                    <div class="flex flex-col bg-black/20 p-3 rounded-xl border border-white/5">
                        <div class="flex items-center gap-2 mb-2">
                            <div class="w-6 h-6 rounded-full bg-white/10 flex items-center justify-center text-[10px] font-bold text-gray-400">${getInitials(p.name)}</div>
                            <span class="text-sm font-bold text-white">${p.name}</span>
                        </div>
                        <div class="flex gap-2">
                            ${p.phone ? `
                                <a href="tel:${p.phone}" class="flex-1 py-2 rounded-lg bg-white/5 hover:bg-sky-500/20 text-gray-300 hover:text-sky-300 text-xs font-semibold flex items-center justify-center gap-2 transition-colors">
                                    <i class="fa-solid fa-phone"></i> Call
                                </a>
                                <a href="sms:${p.phone}" class="flex-1 py-2 rounded-lg bg-white/5 hover:bg-green-500/20 text-gray-300 hover:text-green-300 text-xs font-semibold flex items-center justify-center gap-2 transition-colors">
                                    <i class="fa-solid fa-comment"></i> Text
                                </a>
                            ` : '<span class="text-xs text-gray-600 px-2">No phone listed</span>'}
                        </div>
                    </div>
                `).join('');
            } else {
                pContainer.innerHTML = '<div class="p-4 text-center text-gray-500 text-xs italic">No parent info on file.</div>';
            }

            // Animation
            const overlay = document.getElementById('modal-overlay');
            const backdrop = document.getElementById('modal-backdrop');
            const panel = document.getElementById('modal-panel');

            overlay.classList.remove('hidden');
            void overlay.offsetWidth; // Force Reflow
            backdrop.classList.remove('opacity-0');
            panel.classList.remove('translate-y-full');
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const backdrop = document.getElementById('modal-backdrop');
            const panel = document.getElementById('modal-panel');

            backdrop.classList.add('opacity-0');
            panel.classList.add('translate-y-full');
            currentlyOpenStudentId = null;

            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        }

        // Init
        loadAttendance();
        switchView('dashboard');
        
        // Modal Closer
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
             if(e.target.id === 'modal-backdrop') closeModal();
        });

    </script>
</body>
</html>
